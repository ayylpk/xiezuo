# 写作台 · nginx（静态站 + /api 反代）
#
# 前端代码里所有请求都是相对 /api（见 frontend/src/api/client.ts 的 BASE = "/api"），
# 所以同源反代是唯一「前端零改动」的方案，不要在前端加 baseURL。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 章节正文上限 20 万字符（UTF-8 中文约 600KB），JSON 转义后可能接近 1MB，
    # nginx 默认 client_max_body_size 只有 1m —— 不放大，保存长章节会 413。
    client_max_body_size 8m;

    # 前端静态资源：hash 文件名，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端接口
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端靠这个头决定 cookie 要不要带 Secure（见 routes/auth.ts 的 cookieOpts）
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA 回落：/works/3/chapters 这类前端路由刷新不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
